{{- /* include "/_partials/header.html" PAGE  — PAGE marks the current nav item. */ -}}
{{- $s := (include "/content/site.md" | splitFrontMatter).Meta -}}
{{- $p := index .Args 0 -}}
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="appbar" data-w="AppBar">
	<div class="wrap topbar__in">
		<a class="brand" href="/" {{if eq $p "home"}}aria-current="page"{{end}}>
			<img src="/assets/img/monogram-96.webp" width="32" height="32" alt="" aria-hidden="true">
			<span>{{$s.name}}</span>
		</a>
		<nav class="nav" aria-label="Main">
			<a href="/work/" {{if or (eq $p "work") (eq $p "project")}}aria-current="page"{{end}}>Work</a>
			<a href="/about/" {{if eq $p "about"}}aria-current="page"{{end}}>About</a>
			<a href="/contact/" {{if eq $p "contact"}}aria-current="page"{{end}}>Contact</a>
			<a class="nav__cv" href="{{$s.cv}}" download>CV<span class="vh"> (PDF)</span></a>
		</nav>
		<div class="tools">
			<button type="button" class="tool" data-js="inspect" aria-pressed="false" title="Show how this page is built">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
				<span class="tool__label">Layout</span>
			</button>
			<button type="button" class="tool tool--icon" data-js="theme" aria-pressed="false" aria-label="Dark theme">
				<svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
				<svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
		</div>
	</div>
</header>
